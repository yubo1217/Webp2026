<!DOCTYPE html>
<html>
<head>
    <style>
        table {
            font-family: Arial, Helvetica, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        td, th {
            border: 1px solid #ddd;
            padding: 6px;
        }

        tr:nth-child(even){background-color: #f2f2f2;}
        tr:hover {background-color: #ddd;}

        th {
            padding-top: 12px;
            padding-bottom: 12px;
            text-align: left;
            background-color: #04AA6D;
            color: white;
        }
        iframe {
            width: 90%;
            height: 90%;
        }
    </style>
</head>
<body>
<table id="csie">
    <tr>
        <th>開課單位</th>
        <th>課程名稱</th>
        <th>授課老師</th>
    </tr>

    <tr>
        <td>資工系</td>
        <td style="cursor: pointer"; onclick="openCourse('https://catalog.cgu.edu.tw/coursedata?sectionid=A2337')">物件導向軟體設計</td>
        <td>黃崇源</td>
    </tr>
    <tr>
        <td>資工系</td>
        <td style="cursor: pointer"; onclick="openCourse('https://catalog.cgu.edu.tw/coursedata?sectionid=A2341')">平行程式設計</td>
        <td>李春良</td>
    </tr>
    <tr>
        <td>資工系</td>
        <td style="cursor: pointer"; onclick="openCourse('https://catalog.cgu.edu.tw/coursedata?sectionid=A2338')">作業系統實務</td>
        <td>張哲維</td>
    </tr>
    <tr>
        <td>資工系</td>
        <td style="cursor: pointer"; onclick="openCourse('https://catalog.cgu.edu.tw/coursedata?sectionid=A2342')">人工智慧</td>
        <td>魏志達</td>
    </tr>
    <tr>
        <td>資工系</td>
        <td style="cursor: pointer"; onclick="openCourse('https://catalog.cgu.edu.tw/coursedata?sectionid=A2339')">通訊系統(英語授課)</td>
        <td>陳仁暉</td>
    </tr>
    <tr>
        <td>資工系</td>
        <td style="cursor: pointer"; onclick="openCourse('https://catalog.cgu.edu.tw/coursedata?sectionid=A2340')">軟硬體專題(2)</td>
        <td>黃崇源</td>
    </tr>
</table>

<iframe id="course-frame" src="" popover></iframe>

<button onclick="changeResult()">Change</button>
<script>
    function openCourse(url) {
        const iframe = document.getElementById('course-frame');
        iframe.src = url;
        iframe.showPopover();
    }
    function changeResult(){
        var myTable = document.getElementById("csie");
        myTable.rows[1].cells[2].innerHTML = "李春良";
    }
</script>

</body>
</html>
